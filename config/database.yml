# Postgresql for app data
# SQLite for the Solid Queue database in development

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

sqlite_default: &sqlite_default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# Development also runs Solid Queue, so jobs and recurring tasks behave as in
# production. The queue lives in its own SQLite file.
development:
  primary:
    <<: *default
    database: adavra_sales_development
  queue:
    <<: *sqlite_default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: adavra_sales_test


# Production runs on a host whose disk is wiped on every restart, so nothing
# lives in SQLite there: the app data and the job queue are two PostgreSQL
# databases (for example, two databases of the same Neon project).
production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  queue:
    <<: *default
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
